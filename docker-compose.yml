# Ambiente local alinhado ao SIS (PostgreSQL).
# Uso: docker compose up -d
# Instalador Moodle: http://localhost:8080 — BD host = db, tipo PostgreSQL, porta 5432.

services:
  db:
    image: postgres:16
    container_name: lms-sis-db
    environment:
      POSTGRES_USER: moodle
      POSTGRES_PASSWORD: moodle
      POSTGRES_DB: moodle
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moodle -d moodle"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    image: moodlehq/moodle-php-apache:8.3
    container_name: lms-sis-web
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    environment:
      APACHE_DOCUMENT_ROOT: /var/www/html/public

volumes:
  pgdata:
