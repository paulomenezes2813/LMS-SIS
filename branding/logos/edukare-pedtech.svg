<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 580" role="img" aria-label="Edukare Pedtech">
  <title>Edukare Pedtech</title>

  <defs>
    <linearGradient id="edukareWordmark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"  stop-color="#EC4899"/>
      <stop offset="55%" stop-color="#C026D3"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
    <radialGradient id="nodeShine" cx="35%" cy="35%" r="65%">
      <stop offset="0%"  stop-color="#FB7185" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ÍCONE: rede molecular (5 nós rosa + diamantes púrpura) -->
  <g id="mark" transform="translate(250,200)">

    <!-- Linhas de conexão -->
    <g stroke="#EC4899" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.85">
      <line x1="0"  y1="0"   x2="-95" y2="-55"/>
      <line x1="0"  y1="0"   x2="95"  y2="-40"/>
      <line x1="0"  y1="0"   x2="-60" y2="80"/>
      <line x1="0"  y1="0"   x2="80"  y2="70"/>
      <line x1="-95" y1="-55" x2="95"  y2="-40"/>
    </g>

    <!-- Nós (círculos rosa/magenta) com brilho sutil -->
    <g>
      <circle cx="0"   cy="0"   r="42" fill="#EC4899"/>
      <circle cx="0"   cy="0"   r="42" fill="url(#nodeShine)"/>

      <circle cx="-95" cy="-55" r="26" fill="#EC4899"/>
      <circle cx="-95" cy="-55" r="26" fill="url(#nodeShine)"/>

      <circle cx="95"  cy="-40" r="22" fill="#EC4899"/>
      <circle cx="95"  cy="-40" r="22" fill="url(#nodeShine)"/>

      <circle cx="-60" cy="80"  r="20" fill="#EC4899"/>
      <circle cx="-60" cy="80"  r="20" fill="url(#nodeShine)"/>

      <circle cx="80"  cy="70"  r="28" fill="#EC4899"/>
      <circle cx="80"  cy="70"  r="28" fill="url(#nodeShine)"/>
    </g>

    <!-- Diamantes (quadrados rotacionados 45°) púrpura -->
    <g fill="#6D28D9">
      <rect x="-138" y="-100" width="16" height="16" transform="rotate(45 -130 -92)"/>
      <rect x="118"  y="-95"  width="14" height="14" transform="rotate(45 125 -88)"/>
      <rect x="-150" y="20"   width="12" height="12" transform="rotate(45 -144 26)"/>
      <rect x="135"  y="20"   width="16" height="16" transform="rotate(45 143 28)"/>
      <rect x="-25"  y="120"  width="14" height="14" transform="rotate(45 -18 127)"/>
      <rect x="55"   y="-95"  width="10" height="10" transform="rotate(45 60 -90)"/>
    </g>
  </g>

  <!-- Wordmark EDUKARE -->
  <text x="250" y="425" text-anchor="middle"
        font-family="'Nunito', 'Inter', 'Helvetica Neue', Arial, sans-serif"
        font-weight="900" font-size="82" letter-spacing="-0.01em"
        fill="url(#edukareWordmark)">EDUKARE</text>

  <!-- Subline PEDTECH -->
  <text x="250" y="475" text-anchor="middle"
        font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
        font-weight="500" font-size="22" letter-spacing="0.55em"
        fill="#6D28D9">PEDTECH</text>
</svg>
